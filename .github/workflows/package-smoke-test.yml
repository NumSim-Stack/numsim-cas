name: Package Smoke Test
on:
  workflow_dispatch:
  # A PR from a branch in this repo would otherwise run this workflow
  # twice per commit: once for the push, once for the pull_request.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

# Verifies the installable package (#84/#293): install NumSim_CAS, then
# consume it from a fresh project via find_package(NumSim_CAS).
# Supersede in-progress runs for the same ref rather than queueing them.
# Never on main: merges land in quick succession, and cancelling would
# leave the intermediate commits with no result of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        parser: [ "OFF", "ON" ]
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Installable-package smoke test (parser=${{ matrix.parser }})
        run: ./cmake/package_smoke_test.sh ${{ matrix.parser }}
