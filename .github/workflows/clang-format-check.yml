name: Clang Format Check

on:
  # A PR from a branch in this repo would otherwise run this workflow
  # twice per commit: once for the push, once for the pull_request.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

# Supersede in-progress runs for the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact version .pre-commit-config.yaml uses: Ubuntu's
      # clang-format-18 is 18.1.3, and the two patch levels format some
      # constructs differently, so a hook-clean commit could still fail here.
      - name: Install clang-format 18.1.8
        run: pip install clang-format==18.1.8

      - name: Run clang-format
        run: |
          find . -regex '.*\.\(cpp\|hpp\|c\|h\)' \
            -not -path './build/*' \
            -not -path './.git/*' \
            -print0 \
          | xargs -0 clang-format --dry-run --Werror
