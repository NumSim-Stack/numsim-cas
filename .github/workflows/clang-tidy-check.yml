name: Clang-Tidy Check

on:
  # A PR from a branch in this repo would otherwise run this workflow
  # twice per commit: once for the push, once for the pull_request.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

# Supersede in-progress runs for the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_BUILD_TYPE=Debug
          -DNUMSIM_CAS_BUILD_TESTS=OFF
          -DNUMSIM_CAS_BUILD_EXAMPLES=OFF
          -DNUMSIM_CAS_BUILD_PARSER=ON

      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' -print0 \
          | xargs -0 clang-tidy-18 -p build --warnings-as-errors='*'
